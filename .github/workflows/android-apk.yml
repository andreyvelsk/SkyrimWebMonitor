name: Build Android APK

on:
  push:
    branches:
      - main
      - dev

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run tsc

      - name: Test
        run: npm run test

  build-apk:
    needs: lint
    uses: ./.github/workflows/android-build.yml
    with:
      build_type: debug
      artifact_name: skyrim-web-monitor-debug-apk